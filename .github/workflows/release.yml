name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Create yafsrc junction
        shell: pwsh
        run: ./init-yafsrc.ps1

      - name: Determine release version
        id: version
        shell: pwsh
        run: ./.github/scripts/Get-ReleaseInfo.ps1

      - name: Check for existing release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *>$null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - name: Setup MSBuild
        if: steps.check.outputs.exists != 'true'
        uses: microsoft/setup-msbuild@v3

      - name: Build YAFNET
        if: steps.check.outputs.exists != 'true'
        working-directory: yafsrc
        # Build the web project directly rather than YAF.NET-SqlServer.slnx: the
        # solution also lists ../tests/YAF.Tests.CoreTests, a path that reaches
        # outside the yafsrc junction and resolves lexically against the wrong
        # (nonexistent) directory. YAF-SqlServer.csproj's own ProjectReferences
        # all stay within yafsrc, so building it directly avoids that.
        run: dotnet build YetAnotherForum.NET/YAF-SqlServer.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:WarningLevel=0

      - name: Restore
        if: steps.check.outputs.exists != 'true'
        working-directory: yaf_dnn
        run: dotnet restore YAF.DNN.Module.slnx

      - name: Build DNN package
        if: steps.check.outputs.exists != 'true'
        working-directory: yaf_dnn
        run: msbuild YAF.DNN.Module.slnx /p:Configuration=Release /t:Build "/p:WarningLevel=0;CreateDnnPackages=true"

      - name: Create GitHub Release
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
          NOTES_FILE: ${{ steps.version.outputs.notesFile }}
        run: |
          $assets = Get-ChildItem -Path "yaf_dnn/deploy/*.zip" | ForEach-Object { $_.FullName }
          if (-not $assets) {
            throw "No release assets found in yaf_dnn/deploy/"
          }
          gh release create $env:TAG @assets --title $env:TITLE --notes-file $env:NOTES_FILE --target $env:GITHUB_SHA
